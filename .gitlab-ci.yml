stages:
  - ci

.python-job:
  image: "ghcr.io/astral-sh/uv:python${PYTHON_VERSION}-bookworm-slim"
  interruptible: true
  variables:
    PYTHON_VERSION: "3.11"
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
    UV_LINK_MODE: copy
  cache:
    key:
      files: [uv.lock]
      prefix: "uv-python-${PYTHON_VERSION}"
    paths:
      - .uv-cache/
  after_script:
    - uv cache prune --ci

lint:
  extends: .python-job
  stage: ci
  before_script:
    - uv sync --frozen
  script:
    - uv run --no-sync ruff check src

format:
  extends: .python-job
  stage: ci
  before_script:
    - uv sync --frozen
  script:
    - uv run --no-sync ruff format --check src tests

test:
  extends: .python-job
  stage: ci
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12", "3.13"]
  before_script:
    - uv sync --frozen
  script:
    - uv run --no-sync pytest -m "not paper_fidelity"
  
paper_fidelity:
  extends: .python-job
  stage: ci
  before_script:
    - uv sync --frozen
  script:
    - uv run --no-sync pytest -m paper_fidelity

notebooks:
  extends: .python-job
  stage: ci
  allow_failure: true
  variables:
    MPLBACKEND: Agg
  before_script:
    - uv sync --frozen --no-default-groups --group jupyter
    - mkdir -p "$CI_PROJECT_DIR/executed-notebooks"
    - cd examples/trotter
  script:
    - |
      for NOTEBOOK in generate_baseline_data.ipynb generate_improved_data.ipynb reproduce_plots.ipynb; do
        uv run --no-sync jupyter nbconvert \
          --to notebook \
          --execute "$NOTEBOOK" \
          --ExecutePreprocessor.kernel_name=python3 \
          --ExecutePreprocessor.timeout=-1 \
          --output "$NOTEBOOK" \
          --output-dir "$CI_PROJECT_DIR/executed-notebooks"
      done